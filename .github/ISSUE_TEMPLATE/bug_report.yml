name: Bug report
description: Something does not work the way the docs describe.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "A vulnerability goes to security@usebrainchain.com or this repository's Security tab instead, never in a public issue. Scope and awards: https://docs.usebrainchain.com/security"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest steps, command or failing test that shows it. Leave out private keys and other secrets.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The package version, release tag or commit you used.
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - Mainnet
        - Testnet
        - Not applicable
  - type: input
    id: reference
    attributes:
      label: Task, order or transaction
      description: An id or hash, if the bug involves one.
